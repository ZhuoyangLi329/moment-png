[project]
name = "momentpng"
version = "0.2.0"
description = "ConKer-style shell moments of Quijote local-PNG halos and their analytic models"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pyyaml", "matplotlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["momentpng", "momentpng.theory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
